name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Versioned release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon
          VER="${GITHUB_REF#refs/tags/}"
          OUT="app/build/outputs/apk/release"
          cp "$OUT/app-armeabi-v7a-release.apk" "JPS-Tunnel-${VER}-v7.apk"
          cp "$OUT/app-arm64-v8a-release.apk" "JPS-Tunnel-${VER}-v8.apk"
          cp "$OUT/app-universal-release.apk" "JPS-Tunnel-${VER}-universal.apk"
          sha256sum JPS-Tunnel-"${VER}"-*.apk > SHA256SUMS.txt
          gh release create "$VER" JPS-Tunnel-"${VER}"-*.apk SHA256SUMS.txt \
            --title "JPS Tunnel ${VER}" \
            --notes "Release-signed APKs: v7, v8, and universal. SHA256SUMS.txt verifies every download." \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Rolling latest (branch push)
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon
          OUT="app/build/outputs/apk/release"
          cp "$OUT/app-arm64-v8a-release.apk" JPS-Tunnel.apk
          sha256sum JPS-Tunnel.apk > SHA256SUMS.txt
          gh release delete latest --yes 2>/dev/null || true
          git push origin :refs/tags/latest 2>/dev/null || true
          gh release create latest JPS-Tunnel.apk SHA256SUMS.txt \
            --title "JPS Tunnel (latest v8)" \
            --notes "Build otomatis dari commit ${{ github.sha }}. APK release-signed arm64-v8a." \
            --latest
        env:
          GH_TOKEN: ${{ github.token }}

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Versioned release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon
          VER="${GITHUB_REF#refs/tags/}"
          OUT="app/build/outputs/apk/release"
          cp "$OUT/app-armeabi-v7a-release.apk" "JPS-Tunnel-${VER}-v7.apk"
          cp "$OUT/app-arm64-v8a-release.apk"   "JPS-Tunnel-${VER}-v8.apk"
          cp "$OUT/app-universal-release.apk"    "JPS-Tunnel-${VER}-universal.apk"
          sha256sum JPS-Tunnel-"${VER}"-*.apk > SHA256SUMS.txt
          sed "s/__VER__/${VER}/g" .github/release-notes-android.md > release-notes.md
          gh release create "$VER" JPS-Tunnel-"${VER}"-*.apk SHA256SUMS.txt \
            --title "JPS Tunnel Android ${VER}" \
            --notes-file release-notes.md \
            --latest

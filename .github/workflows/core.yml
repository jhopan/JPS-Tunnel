name: core

on:
  push:
    tags: ['core-v*']
  workflow_dispatch:
    inputs:
      singbox_version:
        description: sing-box version without v prefix
        required: true
        default: '1.11.15'
      core_tag:
        description: core release tag
        required: true
        default: 'core-v1.0.0'

env:
  GO_VERSION: '1.23'
  TAGS: 'with_gvisor,with_clash_api'

jobs:
  android:
    name: android-arm64-libbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28
      - name: Build Android libbox
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          export PATH="$(go env GOPATH)/bin:$PATH"
          git clone --depth 1 --branch "v${{ inputs.singbox_version || '1.11.15' }}" https://github.com/SagerNet/sing-box.git sing-box
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          cd sing-box
          go get golang.org/x/mobile/bind@latest
          gomobile bind -o ../JPS-Tunnel-Core-android-arm64.aar -target=android/arm64 -androidapi=24 -javapkg=io.github.sagernet.libbox -tags="$TAGS" -ldflags="-s -w -X github.com/sagernet/sing-box/constant.Version=v${{ inputs.singbox_version || '1.11.15' }} -extldflags=-Wl,-z,max-page-size=16384" ./experimental/libbox
      - uses: actions/upload-artifact@v4
        with:
          name: core-android-arm64
          path: JPS-Tunnel-Core-android-arm64.aar
          if-no-files-found: error

  desktop:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, goos: linux, goarch: amd64, output: JPS-Tunnel-Core-linux-amd64 }
          - { name: linux-arm64, goos: linux, goarch: arm64, output: JPS-Tunnel-Core-linux-arm64 }
          - { name: freebsd-amd64, goos: freebsd, goarch: amd64, output: JPS-Tunnel-Core-freebsd-amd64 }
          - { name: windows-amd64, goos: windows, goarch: amd64, output: JPS-Tunnel-Core-windows-amd64.exe }
          - { name: macos-intel, goos: darwin, goarch: amd64, output: JPS-Tunnel-Core-macos-intel }
          - { name: macos-apple, goos: darwin, goarch: arm64, output: JPS-Tunnel-Core-macos-apple }
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build sing-box
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "v${{ inputs.singbox_version || '1.11.15' }}" https://github.com/SagerNet/sing-box.git sing-box
          cd sing-box
          CGO_ENABLED=0 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" go build -trimpath -tags "$TAGS" -ldflags "-s -w -X github.com/sagernet/sing-box/constant.Version=v${{ inputs.singbox_version || '1.11.15' }}" -o "../${{ matrix.output }}" ./cmd/sing-box
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.name }}
          path: ${{ matrix.output }}
          if-no-files-found: error

  release:
    name: release
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum JPS-Tunnel-Core-* > SHA256SUMS.txt
          ls -lh
      - name: Publish core release
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then TAG="${{ inputs.core_tag }}"; fi
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" dist/JPS-Tunnel-Core-* dist/SHA256SUMS.txt --title "JPS Tunnel Core $TAG" --notes "sing-box v${{ inputs.singbox_version || '1.11.15' }} core release. Android libbox includes gVisor and Clash API. SHA256SUMS.txt verifies assets." --latest=false
        env:
          GH_TOKEN: ${{ github.token }}
